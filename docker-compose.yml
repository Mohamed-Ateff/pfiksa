version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: employee-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: employee-reports
    volumes:
      - mongodb_data:/data/db
    networks:
      - employee-network

volumes:
  mongodb_data:

networks:
  employee-network:
    driver: bridge
